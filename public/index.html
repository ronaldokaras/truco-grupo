<!--
  Página principal do Trucou!
  Estrutura HTML pura, sem estilos inline.
  Todo o CSS está no arquivo /style.css.
  Contém as telas de menu, mesa de jogo, chat, logs e overlay de truco.
  As imagens estão na pasta public/assets/.
-->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trucou!</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- Botão de controle de áudio -->
  <button id="audio-toggle" class="audio-toggle" title="Ativar/desativar som">🎵</button>
  
  <div id="toasts" class="toasts"></div>

  <div id="logo-container" class="logo-container">
    <img src="/assets/logo.png" alt="Trucou!" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
    <h1 id="logo-fallback" class="logo-fallback">TRUCOU!</h1>
  </div>

  <div id="room-badge" class="room-badge">Sala: <span id="room-code-label"></span></div>

  <!-- OVERLAY DE TRUCO -->
  <div id="truco-overlay" class="truco-overlay">
    <div id="truco-text" class="truco-text"></div>
  </div>

  <!-- MENU PRINCIPAL -->
  <div id="main-menu" class="menu">
    <h2>Bem-vindo!</h2>
    <input type="text" id="player-name" placeholder="Seu nome" maxlength="18" autocomplete="off" />
    <div class="menu-buttons">
      <button onclick="showCreate()">Criar Sala</button>
      <button onclick="showJoin()">Entrar com Código</button>
    </div>
  </div>

  <!-- CRIAR -->
  <div id="create-menu" class="menu">
    <h2>Criar Sala</h2>
    <p class="menu-description">Escolha o modo:</p>
    <div class="menu-buttons">
      <button onclick="createRoom('1v1')">1 vs 1</button>
      <button onclick="createRoom('duplas')">Duplas (2v2)</button>
      <button class="btn ghost" onclick="backToMain()">Voltar</button>
    </div>
  </div>

  <!-- ENTRAR -->
  <div id="join-menu" class="menu">
    <h2>Entrar na Sala</h2>
    <input type="text" id="join-code" class="code-input" placeholder="CÓDIGO" maxlength="6" autocomplete="off" />
    <div class="menu-buttons">
      <button onclick="joinRoom()">Entrar</button>
      <button class="btn ghost" onclick="backToMain()">Voltar</button>
    </div>
  </div>

  <!-- AGUARDANDO -->
  <div id="waiting-screen" class="menu">
    <h2>Aguardando jogadores</h2>
    <p>Código da sala: <strong id="wait-code" class="wait-code"></strong></p>
    <p class="waiting-hint">Compartilhe o código com os colegas</p>
    <ul class="waiting-box" id="waiting-list"></ul>
    
    <!-- Controles do host -->
    <div id="host-controls" class="host-controls">
      <p class="host-controls-title">⚙️ Controles do criador</p>
      <div class="time-limit-options">
        <label class="radio-label">
          <input type="radio" name="timeLimit" value="30"> 30s
        </label>
        <label class="radio-label">
          <input type="radio" name="timeLimit" value="60" checked> 1min
        </label>
        <label class="radio-label">
          <input type="radio" name="timeLimit" value="180"> 3min
        </label>
        <label class="radio-label">
          <input type="radio" name="timeLimit" value="0"> Sem limite
        </label>
      </div>
      <button id="start-game-btn" class="btn start-btn">▶️ Iniciar Partida</button>
    </div>

    <button class="btn ghost leave-waiting-btn" onclick="leaveRoom()">Sair da sala</button>
  </div>

  <!-- MESA -->
  <div class="table" id="game-table"></div>

  <!-- BOTÃO SAIR DA SALA (flutuante) -->
  <button id="leave-room-btn" class="btn ghost leave-room-btn" onclick="leaveRoom()">🚪 Sair da Sala</button>

  <!-- CHAT FLUTUANTE -->
  <div id="chat-container" class="chat-container">
    <div class="chat-header">
      <span>Chat</span>
      <span id="chat-toggle" class="chat-toggle">−</span>
    </div>
    <div id="chat-messages" class="chat-messages">
      <!-- Mensagens aparecerão aqui -->
    </div>
    <div class="chat-input-area">
      <input type="text" id="chat-input" class="chat-input" placeholder="Digite..." maxlength="80">
      <button id="chat-send" class="chat-send">➤</button>
    </div>
  </div>

  <!-- BOTÃO LOGS -->
  <button id="logs-toggle" class="logs-toggle">📜</button>

  <!-- PAINEL DE LOGS -->
  <div id="logs-panel" class="logs-panel">
    <div class="logs-header">
      <h3>📜 Histórico da Partida</h3>
      <button id="logs-close" class="logs-close">&times;</button>
    </div>
    <div id="logs-content" class="logs-content"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/script.js"></script>
</body>
</html>
